# Base scenario projection drivers for NVDA.
#
# Keys here map 1:1 to named ranges in workbooks/NVDA_Projections.xlsx under
# the prefix `nv.` — e.g. the YAML key `supply.cowos_wafers.fy27` maps to the
# named range `nv.supply.cowos_wafers.fy27`.
#
# Only scalar leaves are written to the workbook; container dicts are just
# organizational. Any value set to null is left alone in the workbook (prior
# value retained). Adding new keys is fine — they just have to have a
# matching named range defined in the projection workbook to take effect.
#
# All $ in millions unless noted. Units in actual device counts.
#
# This file is the single lever for Base-scenario model assumptions.
# Every change here should produce a views/changelog.md entry in the same turn.

